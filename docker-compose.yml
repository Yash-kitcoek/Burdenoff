services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: document_vault
      POSTGRES_PASSWORD: document_vault
      POSTGRES_DB: document_vault
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_vault -d document_vault"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
